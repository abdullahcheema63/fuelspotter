services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Inside Docker the API always uses the db and redis services below,
      # whatever DATABASE_URL / CACHE_URL say in .env (those are for running without Docker).
      DATABASE_URL: "postgres://${POSTGRES_USER:-spotter}:${POSTGRES_PASSWORD:-spotter}@db:5432/${POSTGRES_DB:-spotter}"
      CACHE_URL: "redis://redis:6379/0"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-spotter}"
      POSTGRES_USER: "${POSTGRES_USER:-spotter}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-spotter}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
